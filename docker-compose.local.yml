version: '3.8'

services:
  # API Backend (Local SQL Server kullanır)
  api:
    build:
      context: .
      dockerfile: RannaTask.API/Dockerfile
    container_name: rannatask-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      # Windows host'tan SQL Server'a erişim
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal\\SQLEXPRESS;Database=RannaTaskdb;Integrated Security=False;User Id=sa;Password=YourLocalPassword;TrustServerCertificate=True;
      - JwtTokenOptions__Key=your-super-secret-key-min-32-characters-long-for-security
      - JwtTokenOptions__Issuer=RannaTaskAPI
      - JwtTokenOptions__Audience=RannaTaskClients
      - JwtTokenOptions__DurationInMinutes=60
    ports:
      - "5094:80"
    networks:
      - rannatask-network
    restart: unless-stopped

  # WEB Frontend
  web:
    build:
      context: .
      dockerfile: RannaTask.WEB/Dockerfile
    container_name: rannatask-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ApiSettings__BaseUrl=http://api:80/api/
    ports:
      - "5100:80"
    depends_on:
      - api
    networks:
      - rannatask-network
    restart: unless-stopped

networks:
  rannatask-network:
    driver: bridge
